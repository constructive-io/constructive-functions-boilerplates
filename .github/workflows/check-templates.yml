name: Templates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Node builtins only: this repository holds templates, not a package.
      - run: node scripts/check-templates.mjs
